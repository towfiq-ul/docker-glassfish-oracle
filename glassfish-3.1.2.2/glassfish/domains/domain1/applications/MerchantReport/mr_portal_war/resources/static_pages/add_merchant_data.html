<script type="text/javascript" src="resources/js/add_merchant_data.js"></script>
<link href="resources/css/custom.css" rel="stylesheet" type="text/css" media="screen"/>

<h2>Add Merchant Data</h2>
<form name="uploadForm" id="uploadFormId" action="#" method="post">
    <table>
        <tbody>
            <tr>
                <td style="text-align:right">
                    <label for="profileUID">Profile UID(*)</label>
                </td>
                <td>
                    <input type="text" name="profileUID" id="profileUID"/>
                </td>
            </tr>
            <tr>
                <td style="text-align:right">
                    <label for="merchantWallet">Merchant Wallet(*)</label>
                </td>
                <td>
                    <input type="text" name="merchantWallet" id="merchantWallet"/>
                </td>
            </tr>
            <tr>
                <td style="text-align:right">
                    <label for="cash_settlement">Select Cash Settlement</label>
                </td>
                <td>
                    <select name="cash_settlement" id="cash_settlement">
                        <option value="Daily">Daily</option>
                        <option value="Fortnight">Fortnight</option>
                        <option value="Monthly">Monthly</option>
                        <option value="On Request">On Request</option>
                        <option value="weekly">weekly</option>
                        <option value="EFT Issue">EFT Issue</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td> 
                </td>
                <td>
                    <button type="button" onclick="addMerchantData();">Add Merchant Data</button>
                </td>
            </tr>
        </tbody></table>
</form>
