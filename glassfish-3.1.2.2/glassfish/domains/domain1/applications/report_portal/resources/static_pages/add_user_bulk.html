<script type="text/javascript">
    function validateForm() {
        var layer_id = document.forms["uploadForm"]["layer_id"].value;
        var merchant_type = document.forms["uploadForm"]["merchant_type"].value;
        var file = document.forms["uploadForm"]["file"].value;
        if (layer_id === null || layer_id === "" || file === null || file === "" || merchant_type === null || merchant_type === "") {
            alert("Fill Up All the Fields");
            return false;
        }

        if (file.toLowerCase().indexOf(".xlsx") >= 0) {

        }
        else {
            alert("Select .xlsx File Only");
            return false;
        }
    }

<!--<form name="uploadForm" action="Upload" method="post" enctype="multipart/form-data" onsubmit="return validateForm()">-->
<form name="uploadForm" action="BulkUserAdd" method="post" enctype="multipart/form-data">
    <table>
        <tbody>

            <tr>
                <td style="text-align:right">
                    <label for="merchant_type">Select Merchant Type</label>
                </td>
                <td>
                    <select name="merchant_type" id="merchant_type">
                        <!--<option value="">Select Type</option>-->
                        <option value="Small Merchant">Small Merchant</option>
                        <option value="Retail Merchant">Retail Merchant</option>
                        <option value="Corp. Client">Corp. Client</option>
                        <option value="Enterprise Merchant">Enterprise Merchant</option>
                        <option value="Disbursement Merchant">Disbursement Merchant</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td style="text-align:right">
                    <label for="layer_id">Select Merchant Hierarchy</label>
                </td>
                <td>
                    <select name="layer_id" id="layer_id">
                        <!--<option value="">Select Type</option>-->
                        <option value="10">Small Merchant</option>
                        <option value="11">Single RM</option>
                        <option value="21">RM Head Office</option>
                        <option value="22">RM Branch Office</option>
                        <option value="66">Corp. Client Single</option>
                        <option value="61">Corp. Client HO</option>
                        <option value="62">Corp. Client BO</option>
                        <option value="67">Enterprise Merchant</option>
                        <option value="41">Disbursement Merchant</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td style="text-align:right">
                    <label for="file">Upload File(*.xlsx)</label>
                </td>
                <td>
                    <input type="file" name="file" id="file" required/>
                </td>
            </tr>
            <tr>
                <td> 
                </td>
                <td>
                    <input type="submit" value="Bulk Add Merchant" />
                </td>
            </tr>
        </tbody></table>
</form>
