                                    <div id="main">
                                        <nav class="navbar navbar-default navbar-fixed-top" role="navigation">
                                            <div class="container">

                                                    <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-controls="navbar">
                                                        <span class="sr-only">Toggle navigation</span>

                                        <!--LOGIN BOX-->
                                        <div id="login_box">
                                            <div id="login_headline">
                                                <span id="login_text">Login</span>
                                            </div>
                                            <div class="box-content">
                                                <form class="formBox" action="j_security_check" method="POST">
                                                    <fieldset>
                                                        <div class="clearfix">
                                                            <div class="lab"><label for="input-col">Username</label></div>
                                                            <div class="con"><input type="text" class="input" name="j_username"></div>
                                                        </div>
                                                        <div class="clearfix">
                                                            <div class="lab"><label for="textarea-col">Password</label></div>
                                                            <div class="con"><input type="password" class="input" name="j_password"></div>
                                                        </div>
                                                        <div class="btn-submit"><!-- Submit form -->
                                                            <input type="submit" value="Login" class="button">
                                                        </div>
                                                    </fieldset>
                                                </form>   
                                                <div class="form-message help">
                                                    <ul>
                                                        <li> Lost password or need help? </li>
                                                        <li> Call your Account Manager. </li>
                                                    </ul>
                                                </div>   
                                                <div class="form-message success">
                                                    <ul>
                                                        <li>For best view please use Google-Chrome or Firefox</li>
                                                    </ul>
